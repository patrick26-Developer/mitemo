# Parcours critique : présentation au premier lancement, création d'un compte,
# choix du code PIN et arrivée sur l'accueil.
# Lancement : maestro test -e APP_ID=<identifiant de l'application> apps/mobile/.maestro
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- assertVisible: "Vos tontines, sans cahier"
- tapOn: "Suivant"
- assertVisible: "Cotisez en un geste"
- tapOn: "Passer"
- assertVisible: "Bon retour !"
- tapOn: "Créer un compte"
- tapOn: "Prénom"
- inputText: "Aimée"
- tapOn: "Nom"
- inputText: "Mbemba"
- tapOn: "Profession ou formation"
- inputText: "Commerçante"
- tapOn: "Numéro de téléphone"
- inputText: "065706622"
- hideKeyboard
- tapOn: "Continuer"
- assertVisible: "Conditions d'utilisation"
- tapOn: "Accepter"
- assertVisible: "Code PIN"
- tapOn: "4"
- tapOn: "8"
- tapOn: "2"
- tapOn: "1"
- assertVisible: "Bonjour"
- assertVisible: "Aimée Mbemba"
