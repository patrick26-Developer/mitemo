name: Fonctionnalité
description: Proposer un nouveau comportement ou une évolution.
title: "feat: "
labels: ["fonctionnalité", "à trier"]
body:
  - type: textarea
    id: need
    attributes:
      label: Besoin
      description: Qui en a besoin et pourquoi ? Formulation conseillée « En tant que ..., je veux ..., afin de ... ».
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critères d'acceptation
      description: Ils deviendront les premiers tests. Format conseillé « Étant donné ... quand ... alors ... ».
      placeholder: |
        - Étant donné un groupe de 10 membres, quand un membre cotise 5 000 XAF, alors le solde du groupe augmente de 5 000 XAF.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Applications concernées
      multiple: true
      options:
        - api
        - web
        - mobile
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Remarques
      description: Contraintes réglementaires, dépendances, références au cahier des charges.
