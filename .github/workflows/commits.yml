name: Messages de commit

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  commits:
    name: Messages de commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Seuls les commits apportés par la PR sont contrôlés : ceux déjà publiés sur la
      # branche cible ou sur main font partie de l'historique et ne sont pas réécrits.
      - name: Conventional Commits et aucune attribution IA
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list "$HEAD" --not "origin/$BASE_REF" origin/main); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! pnpm exec commitlint --edit "$RUNNER_TEMP/msg"; then
              echo "::error::Commit $sha : message non conforme à Conventional Commits"
              status=1
            fi
            if ! node scripts/check-commit-message.mjs "$RUNNER_TEMP/msg"; then
              echo "::error::Commit $sha : attribution IA interdite"
              status=1
            fi
          done
          exit $status

      # Une PR de promotion (develop → staging, staging → main) ouverte depuis l'interface
      # de GitHub prend le nom de la branche comme titre (« Develop »). Si ce titre n'est
      # pas conforme, il est remplacé par le titre attendu avant le contrôle. Une
      # modification faite avec GITHUB_TOKEN ne relance aucun workflow : pas de boucle.
      - name: Titre de la PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          case "$HEAD_REF:$BASE_REF" in
            develop:staging | staging:main) promotion=$SAME_REPO ;;
            *) promotion=false ;;
          esac
          if [ "$promotion" = true ] && ! echo "$TITLE" | pnpm exec commitlint > /dev/null 2>&1; then
            TITLE="chore(release): promouvoir $HEAD_REF vers $BASE_REF"
            gh pr edit "$PR_URL" --title "$TITLE"
            echo "Titre de promotion remplacé par : $TITLE"
          fi
          echo "$TITLE" | pnpm exec commitlint --verbose
