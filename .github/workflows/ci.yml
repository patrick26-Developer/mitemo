name: CI

on:
  pull_request:
  push:
    branches: [main, staging, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Qualité
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mitemo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installation figée
        run: pnpm install --frozen-lockfile

      - name: Génération du client Prisma
        run: pnpm --filter api prisma:generate

      - name: Audit des dépendances (CVE)
        run: pnpm audit:deps

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests et couverture
        run: pnpm test:ci

      # Base dédiée et jetable : les tests appliquent les migrations puis écrivent des
      # écritures que la base interdit de supprimer. Ils refusent toute autre base.
      - name: Tests d'intégration (PostgreSQL réel)
        run: pnpm --filter api test:int
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mitemo_test

      - name: Tests e2e
        # Appel direct (pas `pnpm test:e2e` via turbo) : turbo ne transmet que les
        # variables déclarées dans globalEnv/env de turbo.json (seul NODE_ENV l'est),
        # et filtre DATABASE_URL par défaut — confirmé en reproduisant localement.
        run: pnpm --filter api test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mitemo_test

      - name: Build
        run: pnpm build

      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: "**/coverage/"
          if-no-files-found: ignore
