name: Assignation automatique

# Toute pull request doit avoir un responsable. À l'ouverture, l'auteur est assigné
# s'il n'y a encore personne.
#
# Déclencheur pull_request et non pull_request_target : GitHub bloque ce dernier par
# défaut sur les dépôts publics à partir du 2 décembre 2026
# (https://docs.github.com/en/actions/reference/security/securely-using-pull_request_target).
# Avec pull_request, le jeton n'a les droits d'écriture que pour une PR ouverte depuis
# une branche de ce dépôt : une PR venant d'un fork est ignorée ici et s'assigne à la
# main (le statut « Assignation » bloque sa fusion tant que personne ne l'est).
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  assign-author:
    name: Assigner l'auteur
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.assignees[0] == null &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # L'état est relu par l'API : avec `gh pr create --assignee`, l'assignation arrive
      # juste après l'événement `opened`, qui la montre encore vide. L'ajout passe par
      # l'API REST, qui ne fait rien si la personne est déjà assignée.
      - name: Assigner l'auteur de la PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          count=$(gh api "repos/$REPO/issues/$NUMBER" --jq '.assignees | length')
          if [ "$count" -gt 0 ]; then
            echo "Déjà assignée, rien à faire."
            exit 0
          fi
          gh api -X POST "repos/$REPO/issues/$NUMBER/assignees" -f "assignees[]=$AUTHOR" --silent
          echo "Assignée à $AUTHOR."
