name: Assignation

# Statut obligatoire : une pull request sans personne assignée ne peut pas être fusionnée.
#
# L'état est relu par l'API et non dans l'événement : à la création d'une PR, l'assignation
# arrive souvent quelques secondes après l'événement `opened` (gh pr create --assignee,
# workflow assign.yml). Le contrôle attend donc jusqu'à une minute avant de conclure, et une
# exécution plus récente pour la même PR annule la précédente.
on:
  pull_request:
    types: [opened, reopened, synchronize, assigned, unassigned, ready_for_review]

concurrency:
  group: assignation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  assignee:
    name: Assignation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier qu'au moins une personne est assignée
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            assignees=$(gh api "repos/$REPO/issues/$NUMBER" --jq '[.assignees[].login] | join(", ")')
            if [ -n "$assignees" ]; then
              echo "Assignée à : $assignees"
              exit 0
            fi
            echo "Tentative $attempt : personne n'est encore assigné, nouvelle lecture dans 10 s."
            sleep 10
          done
          echo "::error::Aucune personne assignée à cette pull request."
          exit 1
